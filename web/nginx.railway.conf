# Serve AstroGram on one origin. /api and /v1 are reverse-proxied to the
# existing FastAPI Railway service, avoiding cross-origin browser requests.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /api/ {
        proxy_pass https://api-production-a831f79f.up.railway.app;
        proxy_ssl_server_name on;
        proxy_ssl_name api-production-a831f79f.up.railway.app;
        proxy_set_header Host api-production-a831f79f.up.railway.app;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 15s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }

    location ^~ /v1/ {
        # Multipart-free photo composer sends up to four base64-encoded WebP images.
        client_max_body_size 20m;
        proxy_pass https://api-production-a831f79f.up.railway.app;
        proxy_ssl_server_name on;
        proxy_ssl_name api-production-a831f79f.up.railway.app;
        proxy_set_header Host api-production-a831f79f.up.railway.app;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 15s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
