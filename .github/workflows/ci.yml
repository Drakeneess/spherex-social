name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: python -m pip install -r requirements.txt
        working-directory: server
      - run: python -m pytest -q
        working-directory: server
      - run: DATABASE_URL=sqlite+pysqlite:///./ci.sqlite3 python -m alembic upgrade head
        working-directory: server
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm test
        working-directory: web

  postgres-realtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: astrogram_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d astrogram_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: python -m pip install -r requirements.txt
        working-directory: server
      - run: python -m alembic upgrade head
        working-directory: server
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/astrogram_ci
      - run: python -m pytest -q tests/test_realtime_pg.py tests/test_realtime.py
        working-directory: server
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/astrogram_ci
