services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: spherex
      POSTGRES_USER: spherex
      POSTGRES_PASSWORD: spherex_dev_only
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spherex -d spherex"]
      interval: 5s
      retries: 10
volumes:
  pg_data:
